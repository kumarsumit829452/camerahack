services:
  - type: web
    name: camera-bot-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: SITE_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
